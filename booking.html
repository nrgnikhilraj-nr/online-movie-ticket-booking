<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book your seats with CineBook">
  <title>CineBook | Book Tickets</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">Cine<span>Book</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#movies">Movies</a>
      </nav>
    </div>
  </header>

  <main class="booking-page">
    <div class="container">
      <div class="page-title">
        <span class="eyebrow">STEP 1 OF 2</span>
        <h1>Select your seats</h1>
        <p id="bookingMovieText">Choose your movie and preferred show.</p>
      </div>

      <div class="booking-layout">
        <section class="booking-panel">
          <div class="booking-controls">
            <label>City
              <select id="citySelect">
                <option>Ranchi</option>
                <option>Delhi</option>
                <option>Bengaluru</option>
                <option>Mumbai</option>
              </select>
            </label>
            <label>Theatre
              <select id="theatreSelect">
                <option>CineBook Multiplex</option>
                <option>Galaxy Cinema</option>
                <option>INOX City Centre</option>
              </select>
            </label>
            <label>Date
              <input id="dateSelect" type="date">
            </label>
            <label>Show Time
              <select id="timeSelect">
                <option>10:30 AM</option>
                <option>01:45 PM</option>
                <option>04:30 PM</option>
                <option>07:30 PM</option>
                <option>10:15 PM</option>
              </select>
            </label>
          </div>

          <div class="screen-wrap">
            <div class="screen">SCREEN</div>
            <p class="screen-note">All eyes this way</p>
          </div>

          <div class="seat-legend">
            <span><i class="seat available"></i> Available</span>
            <span><i class="seat selected"></i> Selected</span>
            <span><i class="seat occupied"></i> Occupied</span>
          </div>

          <div id="seatMap" class="seat-map" aria-label="Cinema seat selection"></div>
        </section>

        <aside class="summary-card">
          <span class="eyebrow">BOOKING SUMMARY</span>
          <h2 id="summaryMovie">Movie</h2>
          <div class="summary-line"><span>Theatre</span><strong id="summaryTheatre">-</strong></div>
          <div class="summary-line"><span>Date</span><strong id="summaryDate">-</strong></div>
          <div class="summary-line"><span>Show</span><strong id="summaryTime">-</strong></div>
          <div class="summary-line"><span>Seats</span><strong id="summarySeats">None</strong></div>
          <hr>
          <div class="summary-line total"><span>Total</span><strong id="summaryTotal">₹0</strong></div>
          <button id="continueBtn" class="btn btn-primary full" disabled>Continue to Ticket</button>
          <a class="back-link" href="index.html#movies">← Choose another movie</a>
        </aside>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
